name: CodeQL

on:
  push:
  pull_request:

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results

      - name: Extract CodeQL findings
        run: python3 scripts/extract_codeql.py

      - name: Save extracted CodeQL findings
        uses: actions/upload-artifact@v4
        with:
          name: codeql-findings
          path: codeql-findings.json
          if-no-files-found: error

      - name: Save CodeQL SARIF report
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-results
          path: sarif-results/*.sarif
          if-no-files-found: error


