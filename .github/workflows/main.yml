name: CodeQL

on:
  push:
  pull_request:

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results

      - name: Extract CodeQL findings
        run: python3 scripts/extract_output.py

      - name: Save extracted CodeQL findings
        uses: actions/upload-artifact@v4
        with:
          name: codeql-findings
          path: codeql-findings.json
          if-no-files-found: error

      - name: Save CodeQL SARIF report
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-results
          path: sarif-results/*.sarif
          if-no-files-found: error

  llm-review:
    name: LLM Review
    needs: analyze
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download CodeQL findings
        uses: actions/download-artifact@v4
        with:
          name: codeql-findings
          path: findings
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate findings JSON
        id: findings
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("findings/codeql-findings.json")
          if not path.exists():
              raise SystemExit(f"Artifact file not found: {path}")

          data = json.loads(path.read_text())
          if not isinstance(data, list):
              raise SystemExit("Expected the findings JSON to be an array")

          print(f"Found {len(data)} CodeQL findings")
          with open("findings-output.txt", "w") as f:
              f.write(str(len(data)))
          PY

          echo "count=$(cat findings-output.txt)" >> "$GITHUB_OUTPUT"

      - name: Run LLM runner
        if: steps.findings.outputs.count != '0'
        run: echo "Findings are ready for the LLM runner"

      - name: Skip LLM review when no findings exist
        if: steps.findings.outputs.count == '0'
        run: echo "No findings to review; skipping LLM runner"


