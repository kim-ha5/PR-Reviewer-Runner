
name: LLM Review

# name: LLM Review

on:
  workflow_run:
    workflows: ["CodeQL"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  llm-review:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download CodeQL findings
        uses: actions/download-artifact@v4
        with:
          name: codeql-findings
          path: findings
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect findings
        run: |
          ls -lah findings
          python3 -m json.tool findings/codeql-findings.json

      - name: Install Python dependency
        run: python3 -m pip install requests

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve > ollama.log 2>&1 &
          curl --fail --retry 30 --retry-delay 2 \
            http://127.0.0.1:11434/api/tags

      - name: Download Qwen model
        run: ollama pull qwen2.5:7b

      - name: Run LLM review
        run: |
          python3 llm_test.py \
            --findings findings/codeql-findings.json \
            --source testing_code.py \
            --prompt prompts/test-prompt.md \
            > findings/llm-review.md

      - name: Upload LLM review
        uses: actions/upload-artifact@v4
        with:
          name: llm-review
          path: |
            findings/llm-review.md
            ollama.log
          if-no-files-found: error
