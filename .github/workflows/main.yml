name: CodeQL

on:
  push:
  pull_request:

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results

      - name: Extract CodeQL findings
        run: python3 scripts/extract_output.py

      - name: Save extracted CodeQL findings
        uses: actions/upload-artifact@v4
        with:
          name: codeql-findings
          path: codeql-findings.json
          if-no-files-found: error

      - name: Save CodeQL SARIF report
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-results
          path: sarif-results/*.sarif
          if-no-files-found: error

  llm-review:
    name: LLM Review
    needs: analyze
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download CodeQL findings
        uses: actions/download-artifact@v4
        with:
          name: codeql-findings
          path: findings
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare findings for LLM integration
        run: |
          python3 scripts/llm_runner.py \
            findings/codeql-findings.json \
            findings/llm-input.json

      - name: Upload prepared findings
        uses: actions/upload-artifact@v4
        with:
          name: llm-input
          path: findings/llm-input.json
          if-no-files-found: error